name: Unity Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: unity-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows:
    name: Build Windows
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          lfs: true

      - name: Cache Unity Library
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-${{ runner.os }}-StandaloneWindows64-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-${{ runner.os }}-StandaloneWindows64-
            Library-${{ runner.os }}-

      - name: Check Unity license secrets
        shell: bash
        env:
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
        run: |
          if [ -z "$UNITY_EMAIL" ] || [ -z "$UNITY_PASSWORD" ]; then
            echo "::error::Add UNITY_EMAIL and UNITY_PASSWORD in Settings > Secrets and variables > Actions."
            exit 1
          fi

          if [ -z "$UNITY_LICENSE" ] && [ -z "$UNITY_SERIAL" ]; then
            echo "::error::Add UNITY_LICENSE for Unity Personal, or UNITY_SERIAL for Unity Pro, in Settings > Secrets and variables > Actions."
            exit 1
          fi

      - name: Build project
        uses: game-ci/unity-builder@v4
        env:
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
        with:
          unityVersion: 6000.1.0f1
          targetPlatform: StandaloneWindows64
          buildName: Nebula-TheSpaceSymphony
          buildsPath: build

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: Nebula-TheSpaceSymphony-Windows
          path: build/StandaloneWindows64
          if-no-files-found: error
          retention-days: 7

      - name: Check itch.io deployment secrets
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        env:
          BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
          ITCH_TARGET: ${{ secrets.ITCH_TARGET }}
        run: |
          if [ -z "$BUTLER_API_KEY" ]; then
            echo "::error::Add BUTLER_API_KEY in Settings > Secrets and variables > Actions."
            exit 1
          fi

          if [ -z "$ITCH_TARGET" ]; then
            echo "::error::Add ITCH_TARGET in Settings > Secrets and variables > Actions. Example: your-itch-username/your-game-slug"
            exit 1
          fi

      - name: Install butler
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          curl --location --output butler.zip https://broth.itch.ovh/butler/linux-amd64/LATEST/archive/default
          unzip -q butler.zip -d butler
          chmod +x butler/butler
          echo "$PWD/butler" >> "$GITHUB_PATH"
          ./butler/butler --version

      - name: Deploy Windows build to itch.io
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        env:
          BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
          ITCH_TARGET: ${{ secrets.ITCH_TARGET }}
        run: |
          butler push build/StandaloneWindows64 "$ITCH_TARGET:windows" --userversion "${GITHUB_SHA::7}"
